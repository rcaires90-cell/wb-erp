<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Seu Agendamento — WB Assessoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/img/logo-wb.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000000;color:#fff;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px 64px}
.brand{width:130px;height:130px;border-radius:50%;overflow:hidden;margin:0 auto 16px;display:block}
.brand img{width:100%;height:100%;display:block;transform:scale(1.55)}
.card{background:#111111;border:1px solid #1a1a1a;border-radius:16px;padding:28px}
h1{font-size:20px;font-weight:700;margin-bottom:6px}
.sub{color:#9ca3af;font-size:14px;margin-bottom:20px}
.info{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;padding:16px 18px;margin-bottom:20px}
.info .l{font-size:12px;color:#808080;text-transform:uppercase;letter-spacing:.06em}
.info .v{font-size:17px;font-weight:700;margin-bottom:8px}
.info .v:last-child{margin-bottom:0}
.status{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:16px}
.st-pendente{background:rgba(234,179,8,.12);color:#facc15;border:1px solid #854d0e}
.st-confirmado{background:rgba(201,168,76,.12);color:#c9a84c;border:1px solid #5c4d22}
.st-cancelado{background:rgba(239,68,68,.12);color:#f87171;border:1px solid #991b1b}
.btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid transparent;margin-top:10px;transition:background .15s}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-ok{background:#c9a84c;color:#000;font-weight:700}
.btn-ok:hover:not(:disabled){background:#d9bb62}
.btn-sec{background:#1a1a1a;color:#e5e7eb;border-color:#333333}
.btn-sec:hover:not(:disabled){border-color:#808080}
.btn-link{background:none;color:#f87171;font-size:14px;font-weight:500}
.msg{font-size:14px;border-radius:8px;padding:12px;margin-top:14px}
.msg-err{background:rgba(239,68,68,.1);border:1px solid #991b1b;color:#fca5a5}
.msg-ok{background:rgba(201,168,76,.1);border:1px solid #5c4d22;color:#e8d9a8}
.sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sel-grid label{display:block;font-size:13px;color:#d1d5db;margin-bottom:6px}
.sel-grid select{width:100%;background:#1a1a1a;border:1px solid #333333;border-radius:8px;padding:10px 12px;font-size:14px;color:#fff;font-family:inherit;outline:none}
.sel-grid select:focus{border-color:#c9a84c}
.sec-title{font-size:13px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin:22px 0 12px}
.wpp{display:block;text-align:center;margin-top:22px;color:#c9a84c;font-size:14px;text-decoration:none}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#c9a84c;border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/img/logo-wb.png" alt="WB Assessoria Migratória"/></div>
  <div class="card" id="card"><div class="spin"></div></div>
  <a class="wpp" href="https://wa.me/5511914258886" target="_blank" rel="noreferrer">Dúvidas? Fale conosco pelo WhatsApp</a>
</div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
const acaoInicial = new URLSearchParams(location.search).get('acao');
const card = document.getElementById('card');
const API = '/api/agendamentos/publico/' + encodeURIComponent(token);
let ag = null, msg = null, modoReagendar = false, dias = [], esc = { data: '', hora: '' };

const SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dt = (iso) => new Date(iso + 'T12:00:00');
const longo = (iso) => { const s = dt(iso).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toUpperCase() + s.slice(1); };
const esc$ = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const STATUS = { a_definir: 'Horário a definir pela equipe', pendente: 'Aguardando sua confirmação', confirmado: 'Presença confirmada', cancelado: 'Cancelado' };

async function api(path, body) {
  const r = await fetch(API + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || 'Algo deu errado. Tente novamente.');
  return j;
}

function render() {
  if (!ag) return;
  const primeiro = ag.nome ? esc$(ag.nome.split(' ')[0]) : '';
  let acoes = '';
  if (ag.passou) {
    acoes = `<p class="sub" style="margin:0">Este horário já passou. Para um novo atendimento, fale com a gente pelo WhatsApp.</p>`;
  } else if (modoReagendar) {
    acoes = `<div class="sec-title">Escolha o novo horário</div>
      ${dias.length ? `<div class="sel-grid">
        <div><label>Dia</label><select onchange="escolherDia(this.value)">${dias.map(d => { const x = dt(d.data); return `<option value="${d.data}"${esc.data===d.data?' selected':''}>${SEM[x.getDay()]}, ${x.getDate()} de ${MES[x.getMonth()]}</option>`; }).join('')}</select></div>
        <div><label>Horário</label><select onchange="escolherHora(this.value)"><option value="">Selecione</option>${(dias.find(d => d.data === esc.data)?.horarios || []).map(h => `<option${esc.hora===h?' selected':''}>${h}</option>`).join('')}</select></div>
      </div>
      <button class="btn btn-ok" onclick="reagendar()" ${esc.data && esc.hora ? '' : 'disabled'}>${esc.data && esc.hora ? `Confirmar ${longo(esc.data)} às ${esc.hora}` : 'Escolha dia e horário'}</button>`
      : `<p class="sub">Não há horários livres nos próximos dias. Fale com a gente pelo WhatsApp.</p>`}
      <button class="btn btn-sec" onclick="modoReagendar=false;msg=null;render()">Voltar</button>`;
  } else if (ag.status === 'cancelado') {
    acoes = `<button class="btn btn-ok" onclick="abrirReagendar()">Escolher novo horário</button>`;
  } else {
    acoes = `${!ag.hora ? `<p class="sub" style="margin:0 0 6px">Nossa equipe vai definir o horário e te avisar por e-mail para você confirmar.</p>` : ''}
      ${ag.status !== 'confirmado' && ag.hora ? `<button class="btn btn-ok" onclick="confirmar()">✅ Confirmar presença</button>` : ''}
      <button class="btn btn-sec" onclick="abrirReagendar()">Reagendar</button>
      <button class="btn btn-link" onclick="cancelar()">Não vou poder ir — cancelar</button>`;
  }
  card.innerHTML = `
    <h1>Olá${primeiro ? ', ' + primeiro : ''}!</h1>
    <p class="sub">Este é o seu atendimento com a WB Assessoria Migratória.</p>
    <span class="status st-${ag.status}">${STATUS[!ag.hora && ag.status !== 'cancelado' ? 'a_definir' : ag.status] || ag.status}</span>
    <div class="info">
      <div class="l">Data</div><div class="v">${longo(ag.data)}</div>
      <div class="l">Horário (Brasília)</div><div class="v">${ag.hora ? esc$(ag.hora) : 'A confirmar pela equipe'}</div>
      ${ag.tipo ? `<div class="l">Tipo</div><div class="v">${esc$(ag.tipo)}</div>` : ''}
    </div>
    ${acoes}
    ${msg ? `<div class="msg msg-${msg.tipo}">${esc$(msg.texto)}</div>` : ''}`;
}

function travar() { card.querySelectorAll('button').forEach(b => b.disabled = true); }

async function confirmar() {
  travar();
  try { ag = await api('/confirmar', {}); msg = { tipo: 'ok', texto: 'Obrigado! Sua presença está confirmada. Até lá!' }; }
  catch (e) { msg = { tipo: 'err', texto: e.message }; }
  render();
}
async function cancelar() {
  if (!confirm('Tem certeza que deseja cancelar este atendimento?')) return;
  travar();
  try { ag = await api('/cancelar', {}); msg = { tipo: 'ok', texto: 'Atendimento cancelado. Se quiser, escolha um novo horário.' }; }
  catch (e) { msg = { tipo: 'err', texto: e.message }; }
  render();
}
async function abrirReagendar() {
  travar(); msg = null;
  try {
    const r = await fetch('/api/agendamentos/publico/horarios?token=' + encodeURIComponent(token));
    const j = await r.json();
    dias = ((r.ok && j.ativa && j.dias) || []).filter(d => !d.aConfirmar); // reagendar exige horário
  } catch { dias = []; }
  esc = { data: dias[0]?.data || '', hora: '' };
  modoReagendar = true;
  render();
}
function escolherDia(d) { esc = { data: d, hora: '' }; render(); }
function escolherHora(h) { esc.hora = h; render(); }
async function reagendar() {
  travar();
  try {
    ag = await api('/reagendar', esc);
    modoReagendar = false;
    msg = { tipo: 'ok', texto: 'Pronto! Seu novo horário está confirmado.' };
  } catch (e) {
    msg = { tipo: 'err', texto: e.message };
    await abrirReagendar(); // recarrega os horários (o escolhido pode ter sido ocupado)
    msg = { tipo: 'err', texto: e.message };
  }
  render();
}

(async () => {
  try {
    ag = await api('');
    if (acaoInicial === 'confirmar' && ag.status === 'pendente' && ag.hora && !ag.passou) return confirmar();
    render();
  } catch (e) {
    card.innerHTML = `<h1>Agendamento não encontrado</h1><p class="sub" style="margin:8px 0 0">O link pode estar incompleto. Fale com a gente pelo WhatsApp que ajudamos você.</p>`;
  }
})();
</script>
</body>
</html>
